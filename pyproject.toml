[project]
name = "yawpose-annotator"
version = "0.1.0"
description = "Local keyboard-first annotator for correcting YawPose head-pose ground truth."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=3.1,<4",
]

[project.scripts]
yawpose-annotator = "yawpose_annotator.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yawpose_annotator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

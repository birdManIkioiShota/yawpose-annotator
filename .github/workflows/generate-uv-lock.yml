name: generate-uv-lock
on:
  push:
    branches: [chatgpt/import-local-ui-changes]
    paths:
      - '.github/workflows/generate-uv-lock.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/import-local-ui-changes
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - name: Generate lockfile
        run: uv lock
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'chore: add uv lockfile'
          git push origin HEAD:chatgpt/import-local-ui-changes
